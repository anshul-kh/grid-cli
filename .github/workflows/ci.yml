name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          go test -race ./... 2>&1 | tee test.log

      # Surfaces the failing test names as run annotations, so a red Windows
      # job is diagnosable without downloading logs.
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          if [ -f test.log ]; then
            grep -E '^(--- FAIL|FAIL|panic:)' test.log | head -30 | while IFS= read -r line; do
              echo "::error title=go test::${line}"
            done
          fi

      - name: Build
        run: go build ./...

      # Attach the per-OS binary to the run so a green build is actually
      # downloadable, and so smoke-testing a PR does not require a local Go
      # toolchain.
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w" -o "grid${{ runner.os == 'Windows' && '.exe' || '' }}" .
          ls -lh grid*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: grid-${{ matrix.os }}
          path: grid${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error

